services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_coach}
      POSTGRES_USER: ${POSTGRES_USER:-ai_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai_coach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_coach} -d ${POSTGRES_DB:-ai_coach}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ai_coach_postgres_data: