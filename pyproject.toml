[project]
name = "ai-coach-rag"
version = "0.1.0"
description = "Document-grounded AI coaching with PostgreSQL pgvector and database-backed conversations"
readme = "README.md"
authors = [
    { name = "Rajamanickam R", email = "rajamanickam.rp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15",
    "anthropic>=0.49",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "langchain-text-splitters>=0.3",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
ai-coach-rag = "ai_coach_rag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
